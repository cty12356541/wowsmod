[workspace]
resolver = "2"
members = ["crates/wowsmod-formats", "crates/wowsmod"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# 测试也用较高优化, 否则 Oodle/meshopt 解码在 debug 下很慢
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
