[package]
name = "wowsmod"
description = "wowsmod: 莱服《战舰世界》AI 改模工具箱命令行"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wowsmod"
path = "src/main.rs"

[features]
default = ["oozextract"]
oozextract = ["wowsmod-formats/oozextract"]

[dependencies]
wowsmod-formats = { path = "../wowsmod-formats", default-features = false }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
rayon = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
