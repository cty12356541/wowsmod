[package]
name = "wowsmod"
description = "wowsmod: 莱服《战舰世界》AI 改模工具箱命令行"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wowsmod"
path = "src/main.rs"

[features]
default = []

[dependencies]
tiny_http = "0.12"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
wowsmod-formats = { path = "../wowsmod-formats", default-features = false }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
rayon = "1"
sha2 = "0.10"
# mod.toml(MIT/Apache)
toml = "0.8"
regex = "1"
# model import 多材质 GLB 的 JPEG 贴图(MIT OR Apache-2.0 OR Zlib, 纯 Rust)
zune-jpeg = "0.4"
# 运行时加载用户本机 Oodle 运行库(ISC)
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
